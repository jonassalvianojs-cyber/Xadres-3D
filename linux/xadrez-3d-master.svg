<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#926c15"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#e7dcc8"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="22" fill="url(#bg)" stroke="url(#gold)" stroke-width="4"/>
  <!-- Mini 2x2 board emblem -->
  <g opacity="0.28">
    <rect x="20" y="20" width="44" height="44" rx="4" fill="#d4af37"/>
    <rect x="64" y="64" width="44" height="44" rx="4" fill="#d4af37"/>
  </g>
  <!-- King Silhouette in Ivory & Gold -->
  <g transform="translate(64, 64)">
    <!-- Cross finial -->
    <rect x="-4" y="-44" width="8" height="18" rx="2" fill="url(#gold)"/>
    <rect x="-10" y="-39" width="20" height="7" rx="2" fill="url(#gold)"/>
    <!-- Crown cup -->
    <path d="M -18 -24 L 18 -24 L 14 -6 L -14 -6 Z" fill="url(#ivory)" stroke="url(#gold)" stroke-width="2"/>
    <!-- Collar ring -->
    <rect x="-16" y="-6" width="32" height="6" rx="3" fill="url(#gold)"/>
    <!-- Body stem -->
    <path d="M -12 0 C -14 14, -20 22, -24 28 L 24 28 C 20 22, 14 14, 12 0 Z" fill="url(#ivory)" stroke="url(#gold)" stroke-width="2"/>
    <!-- Stepped Base -->
    <rect x="-28" y="28" width="56" height="8" rx="3" fill="url(#gold)"/>
    <rect x="-32" y="36" width="64" height="9" rx="4" fill="url(#ivory)" stroke="url(#gold)" stroke-width="2"/>
  </g>
</svg>
